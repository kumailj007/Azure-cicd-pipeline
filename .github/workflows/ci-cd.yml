name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt ruff
      - run: ruff check .
      - run: pytest -v

  validate-iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          az bicep install
          az bicep build --file main.bicep

  build-image:
    needs: [ lint-and-test, validate-iac ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t az400-demo:${{ github.sha }} .

  deploy:
    needs: [ build-image ]
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_DEPLOY == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - run: |
          az group create --name rg-az400-demo --location swedencentral
          az deployment group create --resource-group rg-az400-demo --template-file main.bicep
